# Release check on the ISOLATED TEST Supabase project and the real Vercel Preview.
#
# Runs only when started by hand: Actions → "Release check" → Run workflow (pick the branch).
# Every step works on the test project; scripts/release/guard.sh stops the run first if any
# setting points at production, and test-env.sh refuses any database it didn't set up itself.
# Synthetic data only. Setup and secrets: RELEASE_V4.md.
name: Release check

on:
  workflow_dispatch:
    inputs:
      step:
        description: What to run
        type: choice
        default: all
        options: [all, setup, deploy-function, migrate, e2e, rollback-drill]
      preview_url:
        description: Preview URL (blank = this branch's latest Vercel Preview)
        type: string
        required: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_REF: ${{ secrets.TEST_SUPABASE_PROJECT_REF }}
      PROD_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TEST_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      AI_CONFIGURED: ${{ secrets.TEST_ANTHROPIC_API_KEY != '' && '1' || '' }}
      STEP: ${{ inputs.step }}
    steps:
      - uses: actions/checkout@v5

      - name: Guard — test project only, never production
        run: bash scripts/release/guard.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PostgreSQL client
        run: psql --version || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - name: Password for the synthetic test users (this run only)
        run: |
          pw="Rt$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "TEST_USER_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Set up the test database (production's schema before this release + synthetic data)
        if: env.STEP == 'all' || env.STEP == 'setup'
        run: bash scripts/release/test-env.sh setup

      - name: Deploy the AI function, with the held quota change, to the TEST project only
        if: env.STEP == 'all' || env.STEP == 'deploy-function'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEST_ANTHROPIC_API_KEY: ${{ secrets.TEST_ANTHROPIC_API_KEY }}
        run: |
          git apply scripts/release/ai-quota.patch
          if grep -RInE 'no-verify-jwt|verify_jwt[[:space:]]*=[[:space:]]*false' supabase/config.toml supabase/functions/extract-document-vision 2>/dev/null; then
            echo "::error::extract-document-vision must keep JWT verification on."; exit 1
          fi
          npx --yes supabase@2 functions deploy extract-document-vision --project-ref "$TEST_REF"
          if [ -n "$TEST_ANTHROPIC_API_KEY" ]; then
            npx --yes supabase@2 secrets set --project-ref "$TEST_REF" ANTHROPIC_API_KEY="$TEST_ANTHROPIC_API_KEY" > /dev/null
          fi
          git checkout -- supabase/functions

      - name: Apply 0047 and 0048 through the verified wrappers
        if: env.STEP == 'all' || env.STEP == 'migrate'
        run: bash scripts/release/test-env.sh migrate

      - name: Find the Preview
        if: env.STEP == 'all' || env.STEP == 'e2e'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.preview_url }}
        run: |
          url="$INPUT_URL"
          if [ -z "$url" ]; then
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&environment=Preview" --jq '.[0].id // empty')
            [ -n "$id" ] && url=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '[.[] | select(.state == "success")][0].environment_url // empty')
          fi
          [ -n "$url" ] || { echo "::error::No Preview found for ${{ github.sha }} — start the run with preview_url."; exit 1; }
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Preview: $url"

      - name: Browser for the Preview check
        if: env.STEP == 'all' || env.STEP == 'e2e'
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && npm i -s playwright@1.48.2
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Release check on the real Preview
        if: env.STEP == 'all' || env.STEP == 'e2e'
        run: node scripts/release/preview-e2e.mjs

      - name: Rollback drill (rollback scripts, then forward again)
        if: env.STEP == 'all' || env.STEP == 'rollback-drill'
        run: bash scripts/release/test-env.sh rollback-drill
