# Deploys the extract-document-vision Supabase Edge Function when — and only when — its own code
# changes on the branch production is built from. Nothing else in the repo triggers it.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  a Supabase personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   the project id from the dashboard URL (supabase.com/dashboard/project/<ref>)
# The function's own secret (ANTHROPIC_API_KEY) stays in Supabase and is never touched here.
name: Deploy extract-document-vision

on:
  push:
    branches:
      - claude/dreamy-pasteur-j9a9d9
    paths:
      - 'supabase/functions/extract-document-vision/**'

# Read-only repository access; the workflow only needs to check out the code.
permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy-extract-document-vision
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets first. Nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@v5

      # The function must keep requiring a signed-in user (Supabase's default). Refuse to deploy
      # anything that would turn that off and expose the paid AI model to anonymous callers.
      - name: Keep JWT verification on
        run: |
          if grep -RInE 'no-verify-jwt|verify_jwt[[:space:]]*=[[:space:]]*false' supabase/config.toml supabase/functions/extract-document-vision 2>/dev/null; then
            echo "::error::extract-document-vision must keep JWT verification on. Not deploying."
            exit 1
          fi

      # The official Supabase CLI, straight from npm (major version 2) — no third-party action.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx --yes supabase@2 functions deploy extract-document-vision --project-ref "$SUPABASE_PROJECT_REF"
